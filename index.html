<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CarLog">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<title>CarLog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one phone shell; neutral glass surfaces over a soft monochrome backdrop (car photos carry the colour);
   floating glass tab bar with a sliding indicator; sheets slide up from the bottom edge */
:root{
  --canvas:#E4E5E8;
  --bg:#F2F3F5;
  --bg-grad:radial-gradient(130% 60% at 50% -8%, #FFFFFF 0%, #F4F5F7 45%, #EBEDF0 100%);
  --text:#111114; --text-2:#6B6B73; --text-3:#A8A8B0;
  --hair:rgba(17,17,20,.08);
  --glass:rgba(255,255,255,.64);
  --glass-hi:rgba(255,255,255,.97);
  --glass-line:rgba(255,255,255,.9);
  --glass-shadow:0 1px 2px rgba(16,18,24,.04), 0 12px 32px rgba(16,18,24,.07), inset 0 1px 0 rgba(255,255,255,.9);
  --fill:rgba(118,118,128,.11); --fill-2:rgba(118,118,128,.22);
  --sheet:rgba(249,249,251,.93); --scrim:rgba(10,10,14,.24);
  --backdrop-op:.32;
  --accent:#1F7A5A; --accent-soft:rgba(31,122,90,.12); --on-accent:#FFFFFF; --accent-glow:rgba(31,122,90,.35);
  --fuel:#E8920A; --fuel-soft:rgba(232,146,10,.13);
  --service:#0A72F0; --service-soft:rgba(10,114,240,.11);
  --other:#8E8E93; --other-soft:rgba(142,142,147,.16);
  --warn:#DB8209; --warn-soft:rgba(219,130,9,.13);
  --danger:#E0362B; --danger-soft:rgba(224,54,43,.11);
  --remind:#E0362B; --remind-soft:rgba(224,54,43,.11);
  --ok:#2A9F55; --ok-soft:rgba(42,159,85,.12);
  --frame:#0B0B0C;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
  --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
  --blur:blur(24px) saturate(160%);
  --r-card:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#000000; --bg:#070708;
    --bg-grad:radial-gradient(130% 60% at 50% -8%, #1E1F23 0%, #0D0D0F 50%, #070708 100%);
    --text:#F5F5F7; --text-2:#9C9CA4; --text-3:#5F5F67;
    --hair:rgba(255,255,255,.08);
    --glass:rgba(255,255,255,.055); --glass-hi:rgba(255,255,255,.15); --glass-line:rgba(255,255,255,.09);
    --glass-shadow:0 12px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
    --fill:rgba(255,255,255,.08); --fill-2:rgba(255,255,255,.16);
    --sheet:rgba(24,24,28,.92); --scrim:rgba(0,0,0,.55);
    --backdrop-op:.55;
    --accent:#3DD39B; --accent-soft:rgba(61,211,155,.14); --on-accent:#04140D; --accent-glow:rgba(61,211,155,.3);
    --fuel:#FFAA33; --fuel-soft:rgba(255,170,51,.15);
    --service:#4DA3FF; --service-soft:rgba(77,163,255,.15);
    --other:#A5A5AD; --other-soft:rgba(165,165,173,.16);
    --warn:#FFB340; --warn-soft:rgba(255,179,64,.15);
    --danger:#FF5A4F; --danger-soft:rgba(255,90,79,.15);
    --remind:#FF5A4F; --remind-soft:rgba(255,90,79,.15);
    --ok:#34D16A; --ok-soft:rgba(52,209,106,.15);
    --frame:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#000000; --bg:#070708;
  --bg-grad:radial-gradient(130% 60% at 50% -8%, #1E1F23 0%, #0D0D0F 50%, #070708 100%);
  --text:#F5F5F7; --text-2:#9C9CA4; --text-3:#5F5F67;
  --hair:rgba(255,255,255,.08);
  --glass:rgba(255,255,255,.055); --glass-hi:rgba(255,255,255,.15); --glass-line:rgba(255,255,255,.09);
  --glass-shadow:0 12px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  --fill:rgba(255,255,255,.08); --fill-2:rgba(255,255,255,.16);
  --sheet:rgba(24,24,28,.92); --scrim:rgba(0,0,0,.55);
  --backdrop-op:.55;
  --accent:#3DD39B; --accent-soft:rgba(61,211,155,.14); --on-accent:#04140D; --accent-glow:rgba(61,211,155,.3);
  --fuel:#FFAA33; --fuel-soft:rgba(255,170,51,.15);
  --service:#4DA3FF; --service-soft:rgba(77,163,255,.15);
    --other:#A5A5AD; --other-soft:rgba(165,165,173,.16);
  --warn:#FFB340; --warn-soft:rgba(255,179,64,.15);
  --danger:#FF5A4F; --danger-soft:rgba(255,90,79,.15);
  --remind:#FF5A4F; --remind-soft:rgba(255,90,79,.15);
  --ok:#34D16A; --ok-soft:rgba(52,209,106,.15);
  --frame:#000000;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--canvas); color:var(--text);
  font-family:var(--font); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:24px;
  display:flex; justify-content:center;
}
button{font-family:inherit;color:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- phone shell ---------- */
.phone{width:350px;height:740px;border-radius:56px;background:var(--frame);padding:11px;box-shadow:0 40px 90px rgba(0,0,0,.35);flex:none}
.screen-inner{width:100%;height:100%;border-radius:46px;overflow:hidden;position:relative;background:var(--bg-grad);display:flex;flex-direction:column}
.statusbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;color:var(--text);position:relative;z-index:50;font-variant-numeric:tabular-nums}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:96px;height:27px;border-radius:14px;background:#000;z-index:51}
.sb-icons{display:flex;gap:5px;align-items:center}
.sb-icons svg{height:11px}

.content{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
.screen-body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
@media (prefers-reduced-motion: no-preference){
  .screen-body{transition:transform 300ms var(--ease-out), opacity 240ms var(--ease-out)}
}
.scroll{flex:1;overflow-y:auto;padding:0 16px 124px;position:relative;z-index:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- type ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 20px 18px;flex:none;position:relative;z-index:1}
.page-head h1{margin:0;font-family:var(--font-display);font-size:32px;line-height:1.08;font-weight:700;letter-spacing:-.026em;text-wrap:balance}
.page-head p{margin:5px 0 0;font-size:14px;color:var(--text-2)}
.kicker,.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.page-head .kicker{margin-bottom:5px}
.sec-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin:26px 4px 10px}
.sec-h.first{margin-top:4px}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.head-actions{display:flex;gap:8px;padding-bottom:3px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;padding:0;cursor:pointer;
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm svg{width:16px;height:16px}
.icon-btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 8px 18px -6px var(--accent-glow)}
.ico-swap{display:flex}
@media (prefers-reduced-motion: no-preference){ .ico-swap.spin{animation:iconIn 340ms var(--ease-out)} }
@keyframes iconIn{from{opacity:0;transform:rotate(-80deg) scale(.7)}to{opacity:1;transform:none}}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;font-size:16px;font-weight:600;border:none;cursor:pointer}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.tinted{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.danger-solid{background:var(--danger);color:#fff}
.btn.plain{background:var(--fill);color:var(--text)}
.btn-row{display:flex;gap:10px}
.btn-stack{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.navbtn{background:none;border:none;color:var(--accent);font-size:16px;font-weight:500;cursor:pointer;padding:6px 4px;border-radius:8px;white-space:nowrap}
.navbtn.strong{font-weight:600}
.fab{position:absolute;right:20px;bottom:98px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;z-index:25;box-shadow:0 12px 26px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25)}
.fab svg{width:24px;height:24px}
@media (prefers-reduced-motion: no-preference){ .fab{animation:fabIn 360ms var(--ease-out) both} }
@keyframes fabIn{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}

/* press feedback (instant response, 160ms ease-out) */
@media (prefers-reduced-motion: no-preference){
  .carcard,.icon-btn,.btn,.fab,.chip,.row.tap,.rem-card,.tab,.seg button,.navbtn,.act-btn,.stepper button,.switch{transition:transform 160ms var(--ease-out)}
  .carcard:active,.rem-card:active,.row.tap:active{transform:scale(.98)}
  .icon-btn:active,.btn:active,.fab:active,.act-btn:active{transform:scale(.96)}
  .chip:active,.tab:active,.seg button:active,.navbtn:active,.stepper button:active{transform:scale(.93)}
}

/* entrance (only when a screen is entered, never on in-place re-renders) */
@media (prefers-reduced-motion: no-preference){
  .enter{animation:fadeUp 420ms var(--ease-out) both}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- glass surfaces ---------- */
.card,.grouped,.carcard,.log-card,.rem-card,.seg,.metrics,.kpi{
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);
}
.card{border-radius:var(--r-card);padding:16px}
.grouped{border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:54px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.row.tap{cursor:pointer}
.row .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.row .ic svg{width:17px;height:17px}
.row .tt{flex:1;min-width:0}
.row .t1{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12.5px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-size:15px;color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v.big{font-size:20px;font-weight:650;color:var(--text);letter-spacing:-.01em}
.row .t1.wrap{white-space:normal;line-height:1.3}
.row .chev{width:16px;height:16px;color:var(--text-3);flex:none}
.row.danger .t1{color:var(--danger)}

/* ---------- chips, pills, tags ---------- */
.chip-row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--hair);background:var(--fill);font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip.car{padding:3px 12px 3px 3px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--fill);color:var(--text-2)}
.tag{display:inline-flex;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--service-soft);color:var(--service)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.id-dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.car-ring{display:inline-flex;padding:2px;border:2px solid transparent;border-radius:50%;flex:none}

/* ---------- vehicles list ---------- */
.carcard{border-radius:26px;overflow:hidden;position:relative;cursor:pointer;display:block;width:100%;text-align:left;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.carcard+.carcard{margin-top:16px}
.cc-photo{height:160px;position:relative;overflow:hidden;background:var(--fill)}
.cc-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cc-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff}
.cc-shade{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(transparent, rgba(0,0,0,.55))}
.cc-km{position:absolute;left:16px;bottom:12px;color:#fff;display:flex;align-items:baseline;gap:5px}
.cc-km b{font-size:22px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.cc-km span{font-size:12px;font-weight:600;opacity:.8}
.cc-more{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(0,0,0,.32);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);color:#fff;padding:0}
.cc-more svg{width:18px;height:18px}
.cc-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.cc-name-row{display:flex;align-items:center;gap:7px}
.cc-name{font-size:18px;font-weight:600;letter-spacing:-.012em;margin-top:3px}
.cc-sub{font-size:13px;color:var(--text-2);display:flex;gap:7px;align-items:center;margin-top:3px}
.sub-dot{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
.meter{display:flex;flex-direction:column;gap:8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--text-2)}
.meter-top b{font-weight:600}
.pbar{height:6px;border-radius:999px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;transform-origin:left center}
@media (prefers-reduced-motion: no-preference){ .pbar i.grow{animation:growX 800ms var(--ease-out) both} }
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- car detail ---------- */
.navbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px 8px 10px;min-height:42px;position:relative;z-index:3}
.navbar .back{display:flex;align-items:center;gap:0;color:var(--accent);font-size:16px;font-weight:500;background:none;border:none;padding:6px 6px 6px 0;cursor:pointer}
.navbar .back svg{width:22px;height:22px}
.backdrop{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(48px) saturate(1.15);opacity:var(--backdrop-op);z-index:0;pointer-events:none}
.backdrop-veil{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg, transparent 0%, var(--bg) 78%)}
.detail-photo-wrap{height:200px;position:relative;overflow:hidden}
.detail-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.detail-photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff}
.detail-photo-fade{position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(transparent, rgba(0,0,0,.4))}
.scroll.flush{padding-left:0;padding-right:0}
.detail-pad{padding:16px 16px 0}
.hero-sticky{position:sticky;top:0;z-index:15;padding:14px 20px 14px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--hair)}
.hero-sticky h2{margin:4px 0 0;font-family:var(--font-display);font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.hero-meta{display:flex;align-items:center;gap:8px;margin-top:10px}
.plate-chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.07em;padding:4px 10px;border-radius:8px;background:var(--fill);border:1px solid var(--hair);font-variant-numeric:tabular-nums}

/* segmented control with a sliding thumb */
.seg{position:relative;display:grid;padding:3px;border-radius:14px;margin-top:14px}
.seg button{position:relative;z-index:1;background:none;border:none;padding:8px 0;font-size:12.5px;font-weight:600;letter-spacing:-.005em;color:var(--text-2);cursor:pointer;border-radius:11px;white-space:nowrap;transition:color 200ms ease}
.seg button.on{color:var(--text)}
.seg-thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;border-radius:11px;background:var(--glass-hi);box-shadow:0 2px 10px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.25)}
@media (prefers-reduced-motion: no-preference){ .seg-thumb{transition:transform 320ms var(--ease-in-out)} }

/* metrics strip */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-radius:var(--r-card);padding:16px 4px}
.metric{padding:0 12px;min-width:0}
.metric+.metric{border-left:1px solid var(--hair)}
.metric .val{font-size:19px;font-weight:700;letter-spacing:-.015em;margin-top:7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric .unit{font-size:12px;font-weight:500;color:var(--text-2);margin-left:2px}

/* fuel & service entry cards */
.log-card{border-radius:var(--r-card);padding:16px 16px 4px}
.log-card+.log-card{margin-top:12px}
.lc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px}
.lc-date{font-size:16px;font-weight:600;letter-spacing:-.01em}
.lc-when{font-size:12.5px;color:var(--text-2);margin-top:3px}
.lc-amt{text-align:right}
.lc-amt b{display:block;font-size:20px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin-top:3px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-top:1px solid var(--hair)}
.kv .k{font-size:14px;color:var(--text-2)}
.kv .v{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lc-tags{padding:0 0 12px}

/* reminders */
.rem-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;cursor:pointer;width:100%;text-align:left}
.rem-card+.rem-card{margin-top:10px}
.rem-av{position:relative;flex:none}
.rem-av .ty{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass-hi);border:1px solid var(--hair);color:var(--text)}
.rem-av .ty svg{width:11px;height:11px}
.rem-tt{flex:1;min-width:0}
.rem-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem-sub{font-size:12.5px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auto{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-left:5px}

/* settings */
.app-id{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-card)}
.app-id img{width:92px;height:46px;border-radius:12px;object-fit:cover;background:#000;flex:none}
.app-id .nm{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em}

  function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function seedOf(str){ var h = 2166136261; for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  function buildDemo(car){
    var cfg = DEMO[car.id]; if(!cfg) return null;
    var rnd = mulberry32(seedOf(car.id+"-carlog-demo"));
    function r(a,b){ return a+(b-a)*rnd(); }
    var today = todayISO(), start = addDays(today, -300);
    var fills = [];
    var km = car.km - Math.round(r(20,90));
    var date = addDays(today, -Math.round(r(1,4)));
    while(date >= start){
      var trip = Math.round(r(cfg.trip[0], cfg.trip[1]));
      fills.push({date:date, km:km, trip:trip});
      km -= trip;
      date = addDays(date, -Math.max(5, Math.round(trip/cfg.kmPerDay + r(-1.5,1.5))));
    }
    fills.reverse(); // oldest first
    var fuelLogs = fills.map(function(f, i){
      var mon = +f.date.slice(5,7);
      var cons = r(cfg.cons[0], cfg.cons[1]) + ((mon>=10 || mon<=3) ? 0.35 : 0);
      var liters = Math.round(f.trip*cons/100*10)/10;
      var place = cfg.places[Math.floor(rnd()*cfg.places.length)];
      var price = Math.round(((DIESEL_PRICE[f.date.slice(0,7)] || 1.54) + (PLACE_OFFSET[place]||0) + r(-0.01,0.01))*100)/100;
      return {id:"demo-f-"+car.id+"-"+i, date:f.date, km:f.km, liters:liters, price:price, total:Math.round(liters*price*100)/100,
        place:place, fuelType:"Dizel", tripKm:f.trip, avgConsumption:Math.round((cons-0.2)*10)/10, demo:true};
    });
    function kmAt(iso){
      if(!fills.length) return car.km;
      if(iso <= fills[0].date) return fills[0].km - Math.round(daysBetween(iso, fills[0].date)*cfg.kmPerDay);
      var last = fills[fills.length-1];
      if(iso >= last.date) return Math.min(car.km, last.km + Math.round(daysBetween(last.date, iso)*cfg.kmPerDay));
      for(var i=0;i<fills.length-1;i++){
        var a = fills[i], b = fills[i+1];
        if(iso >= a.date && iso <= b.date){
          var span = daysBetween(a.date, b.date) || 1;
          return Math.round(a.km + (b.km-a.km)*daysBetween(a.date, iso)/span);
        }
      }
      return car.km;
    }
    var serviceLogs = cfg.services.slice().sort(function(a,b){ return b.ago-a.ago; }).map(function(s, i){
      var d = addDays(today, -s.ago);
      return {id:"demo-s-"+car.id+"-"+i, date:d, km:kmAt(d), desc:s.desc, types:s.types.slice(), price:s.price, oil:s.types.indexOf("Zamjena ulja")!==-1, demo:true};
    });
    var expenses = (cfg.expenses||[]).map(function(x, i){
      return {id:"demo-e-"+car.id+"-"+i, date:addDays(today, -x.ago), cat:x.cat, amount:x.amount, note:x.note||"", demo:true};
    });
    var oils = serviceLogs.filter(function(l){ return l.oil; });
    var reminders = cfg.reminders.map(function(m, i){
      return {id:"demo-r-"+car.id+"-"+i, carId:car.id, type:m.type, dueDate:m.inDays!=null ? addDays(today, m.inDays) : "", dueKm:m.atKm||0, note:m.note||"", demo:true};
    });
    return {fuelLogs:fuelLogs, serviceLogs:serviceLogs, expenses:expenses, oilAtKm:oils.length ? oils[oils.length-1].km : null, regDate:addDays(today, cfg.regIn), reminders:reminders};
  }
  function sortLogs(car){
    car.fuelLogs.sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || (b.km-a.km); });
    car.serviceLogs.sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || (b.km-a.km); });
    car.expenses.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
  }
  function applyDemo(on){
    state.cars.forEach(function(car){
      car.fuelLogs = car.fuelLogs.filter(function(l){ return !l.demo; });
      car.serviceLogs = car.serviceLogs.filter(function(l){ return !l.demo; });
      car.expenses = (car.expenses||[]).filter(function(l){ return !l.demo; });
      if(car.demoMeta){
        if(car.demoMeta.regFromDemo) car.regDate = "";
        if(car.demoMeta.oilFromDemo) car.oilAtKm = car.demoMeta.oilBefore;
        delete car.demoMeta;
      }
    });
    state.reminders = state.reminders.filter(function(r){ return !r.demo; });
    if(on){
      state.cars.forEach(function(car){
        var d = buildDemo(car); if(!d) return;
        var meta = {regFromDemo:false, oilFromDemo:false, oilBefore:car.oilAtKm};
        car.fuelLogs = car.fuelLogs.concat(d.fuelLogs);
        car.serviceLogs = car.serviceLogs.concat(d.serviceLogs);
        car.expenses = car.expenses.concat(d.expenses);
        var ownOil = car.serviceLogs.some(function(l){ return l.oil && !l.demo; });
        if(!ownOil && d.oilAtKm!=null){ car.oilAtKm = d.oilAtKm; meta.oilFromDemo = true; }
        if(!car.regDate){ car.regDate = d.regDate; meta.regFromDemo = true; }
        car.demoMeta = meta;
        state.reminders = state.reminders.concat(d.reminders);
        sortLogs(car);
      });
    }
    saveCars(); saveReminders();
  }

  // ---------- init ----------
  (function init(){
    var s = lsGet(KEYS.set) || {};
    state.settings = {};
    Object.keys(DEFAULT_SETTINGS).forEach(function(k){ state.settings[k] = s[k]!==undefined ? s[k] : DEFAULT_SETTINGS[k]; });
    var loaded = lsGet(KEYS.cars);
    state.cars = loaded && loaded.length ? loaded : SEED_CARS.map(function(c){ return Object.assign({}, c); });
    state.reminders = lsGet(KEYS.rem) || [];
    state.cars.forEach(function(c){ c.fuelLogs = c.fuelLogs || []; c.serviceLogs = c.serviceLogs || []; c.expenses = c.expenses || [];
      c.type = c.type || "auto"; c.unit = (c.unit === "h" || vType(c.type).hoursOnly) ? "h" : "km"; });
    // every car gets its own random identity colour (unique while the palette lasts)
    var used = [];
    state.cars.forEach(function(c){
      if(CAR_PALETTE.indexOf(c.color) === -1 || used.indexOf(c.color) !== -1){
        var free = CAR_PALETTE.filter(function(p){ return used.indexOf(p) === -1; });
        var pool = free.length ? free : CAR_PALETTE;
        c.color = pool[Math.floor(Math.random()*pool.length)];
      }
      used.push(c.color);
    });
    if(DEMO_MODE && !lsGet(KEYS.demo)){ applyDemo(true); lsSet(KEYS.demo, true); }
    saveCars(); saveSettings();
    document.documentElement.setAttribute("data-theme", state.settings.theme);
  })();

  // ---------- reminders model ----------
  function reminderItems(carId){
    var items = [];
    state.cars.forEach(function(car){
      if(carId && car.id !== carId) return;
      if(car.regDate) items.push({key:"reg-"+car.id, kind:"reg", car:car, title:"Registracija", dueDate:car.regDate});
      var oil = oilRemaining(car);
      items.push({key:"oil-"+car.id, kind:"oil", car:car, title:"Mali servis", dueKm:car.km + oil.remaining, oil:oil});
    });
    state.reminders.forEach(function(rem){
      if(carId && rem.carId !== carId) return;
      var car = carById(rem.carId); if(!car) return;
      items.push({key:rem.id, kind:"stored", car:car, title:rem.type, dueDate:rem.dueDate, dueKm:rem.dueKm, note:rem.note, rem:rem});
    });
    items.forEach(function(it){
      if(it.dueDate){
        var d = daysUntil(it.dueDate);
        it.days = d;
        it.label = d < 0 ? "kasni "+(-d)+" "+dana(d) : d === 0 ? "danas" : "za "+d+" "+dana(d);
        it.status = d < 0 ? "danger" : d <= 30 ? "warn" : "ok";
        it.when = fmtDate(it.dueDate);
      } else {
        var left = it.dueKm - it.car.km;
        it.days = left/50;
        var u = unitOf(it.car);
        it.label = left <= 0 ? "prekoračeno "+fmt(-left)+" "+u : "za "+fmt(left)+" "+u;
        it.status = it.kind==="oil" ? oilStatus(left, it.car) : (left <= 0 ? "danger" : left <= 1500 ? "warn" : "ok");
        it.when = "na "+fmt(it.dueKm)+" "+u;
      }
    });
    items.sort(function(a,b){ return a.days - b.days; });
    return items;
  }
  function urgentCount(){ return reminderItems().filter(function(it){ return it.status !== "ok"; }).length; }

  // ---------- motion helpers ----------
  function countUps(root){
    Array.prototype.forEach.call((root||document).querySelectorAll("[data-count]"), function(el){
      var to = parseFloat(el.getAttribute("data-count")), dec = +(el.getAttribute("data-dec")||0), suf = el.getAttribute("data-suffix")||"";
      if(REDUCE_MOTION || !isFinite(to)){ el.textContent = numFmt(to, dec)+suf; return; }
      var t0 = performance.now(), dur = +(el.getAttribute("data-dur")||850);
      setTimeout(function(){ el.textContent = numFmt(to, dec)+suf; }, dur+80); // rAF is paused in background tabs
      (function step(t){
        var p = Math.min(1, (t-t0)/dur), e = 1-Math.pow(1-p, 3);
        el.textContent = numFmt(to*e, dec)+suf;
        if(p < 1) requestAnimationFrame(step);
      })(t0);
    });
  }
  function countAttr(n, dec, suffix){ return ' data-count="'+n+'" data-dec="'+(dec||0)+'" data-suffix="'+esc(suffix||"")+'"'; }
  function enterCls(anim){ return anim ? " enter" : ""; }
  function delay(anim, ms){ return anim ? ' style="animation-delay:'+ms+'ms"' : ""; }
  function segHtml(items, active, prev, attr){
    var idx = Math.max(0, items.findIndex(function(it){ return it[0]===active; }));
    var pidx = Math.max(0, items.findIndex(function(it){ return it[0]===prev; }));
    return '<div class="seg" style="grid-template-columns:repeat('+items.length+',1fr)">'+
      '<i class="seg-thumb" data-to="'+idx+'" style="width:calc((100% - 6px) / '+items.length+');transform:translateX('+(pidx*100)+'%)"></i>'+
      items.map(function(it){ return '<button type="button" class="'+(it[0]===active?'on':'')+'" '+attr+'="'+it[0]+'">'+it[1]+'</button>'; }).join("")+
    '</div>';
  }
  function settleSegs(root){
    Array.prototype.forEach.call((root||document).querySelectorAll(".seg-thumb"), function(th){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ th.style.transform = "translateX("+(+th.getAttribute("data-to")*100)+"%)"; }); });
    });
  }
  var toastTimer = null;
  function toast(text){
    var t = document.getElementById("toast");
    t.innerHTML = ICONS.check+'<span>'+esc(text)+'</span>';
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2000);
  }

  // ---------- theme ----------
  function themeBtnHtml(){
    return '<button class="icon-btn" id="themeBtn" aria-label="Promijeni temu"><span class="ico-swap">'+(state.settings.theme==="dark" ? ICONS.moon : ICONS.sun)+'</span></button>';
  }
  function setTheme(t){
    if(t === state.settings.theme) return;
    state.settings.theme = t; saveSettings();
    var apply = function(){ document.documentElement.setAttribute("data-theme", t); };
    if(document.startViewTransition && !REDUCE_MOTION){ try{ document.startViewTransition(apply); }catch(e){ apply(); } }
    else apply();
  }
  function wireThemeBtn(){
    var b = document.getElementById("themeBtn"); if(!b) return;
    b.addEventListener("click", function(){
      setTheme(state.settings.theme==="dark" ? "light" : "dark");
      var sw = b.querySelector(".ico-swap");
      sw.innerHTML = state.settings.theme==="dark" ? ICONS.moon : ICONS.sun;
      sw.classList.remove("spin"); void sw.offsetWidth; sw.classList.add("spin");
    });
  }

  // ---------- rendering ----------
  var navbarHost = document.getElementById("navbarHost");
  var screenBody = document.getElementById("screenBody");
  var tabbar = document.getElementById("tabbar");
  var TABS = ["vozila","stat","remind","settings"];

  function clearFab(){ var f = document.getElementById("detailFab"); if(f) f.remove(); }
  function addFab(onClick, label){
    var fab = document.createElement("button");
    fab.className = "fab"; fab.id = "detailFab"; fab.setAttribute("aria-label", label);
    fab.innerHTML = ICONS.plus;
    fab.addEventListener("click", onClick);
    document.getElementById("contentHost").appendChild(fab);
  }

  function mount(html, direction){
    clearFab();
    screenBody.innerHTML = html;
    settleSegs(screenBody);
    if(REDUCE_MOTION || direction === "none" || !direction){ return; }
    var dx = direction === "back" ? -16 : (direction === "in" ? 16 : 0);
    screenBody.style.transition = "none";
    screenBody.style.opacity = "0";
    screenBody.style.transform = dx ? "translateX("+dx+"px)" : "translateY(6px)";
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        screenBody.style.transition = "";
        screenBody.style.opacity = "1";
        screenBody.style.transform = "none";
      });
    });
  }

  function render(direction){
    renderTabbar();
    if(state.activeTab === "vozila"){
      if(state.screen === "detail" && carById(state.selectedId)) renderDetail(direction);
      else { state.screen = "home"; renderHome(direction); }
    } else if(state.activeTab === "stat") renderStatsTab(direction);
    else if(state.activeTab === "remind") renderRemindTab(direction);
    else renderSettingsTab(direction);
    renderFormSheet();
  }

  function renderTabbar(){
    var idx = TABS.indexOf(state.activeTab);
    document.getElementById("tabInd").style.transform = "translateX("+(idx*100)+"%)";
    Array.prototype.forEach.call(tabbar.querySelectorAll(".tab"), function(btn){
      btn.classList.toggle("on", btn.dataset.tab === state.activeTab);
    });
    var badge = document.getElementById("remBadge");
    var n = state.settings.notify ? urgentCount() : 0;
    badge.hidden = !n;
    badge.textContent = n;
  }

  // ===== Vehicles =====
  function renderHome(direction){
    navbarHost.innerHTML = "";
    var anim = direction && direction !== "none" && !REDUCE_MOTION;
    var types = VEHICLE_TYPES.filter(function(t){ return state.cars.some(function(c){ return c.type===t.id; }); });
    if(types.length < 2 || !types.some(function(t){ return t.id===state.vType; })) state.vType = "all";
    var cars = state.vType === "all" ? state.cars : state.cars.filter(function(c){ return c.type===state.vType; });
    var typeFilter = types.length < 2 ? "" : '<div class="type-filter"><button type="button" class="chip'+(state.vType==="all"?' on':'')+'" data-vtype="all">Sve</button>'+
      types.map(function(t){ return '<button type="button" class="chip'+(state.vType===t.id?' on':'')+'" data-vtype="'+t.id+'">'+t.icon+t.label+'</button>'; }).join("")+'</div>';
    var list = cars.map(function(car, i){
      var oil = oilRemaining(car), st = oilStatus(oil.remaining, car);
      var photo = car.photo ? '<img src="'+car.photo+'" alt="">' : '<div class="cc-fallback" style="background:'+car.color+'">'+initials(car.make,car.model)+'</div>';
      return '<div class="carcard'+enterCls(anim)+'" data-car-open="'+car.id+'"'+delay(anim, 90+i*70)+'>'+
        '<div class="cc-photo">'+photo+'<div class="cc-shade"></div>'+
          '<div class="cc-km"><b'+(anim?countAttr(car.km,0,""):"")+'>'+fmt(car.km)+'</b><span>'+unitOf(car)+'</span></div>'+
          '<button class="cc-more" data-car-more="'+car.id+'" aria-label="Opcije vozila">'+ICONS.more+'</button>'+
        '</div>'+
        '<div class="cc-body">'+
          '<div>'+
            '<div class="cc-name-row"><span class="id-dot" style="background:'+car.color+'"></span><span class="eyebrow">'+esc(car.make)+'</span></div>'+
            '<div class="cc-name">'+esc(car.model)+'</div>'+
            '<div class="cc-sub"><span>'+esc(car.plate)+'</span><span class="sub-dot"></span><span>'+car.year+'.</span><span class="sub-dot"></span><span>'+esc(car.engine)+'</span></div>'+
          '</div>'+
          '<div class="meter">'+
            '<div class="meter-top"><span>Ulje · '+fmt(Math.max(0,oil.used))+' / '+fmt(oil.interval)+' '+unitOf(car)+'</span>'+
              '<b style="color:'+(st==="ok"?"var(--text)":toneVar(st))+'">'+(oil.remaining<=0 ? "Servis odmah" : "još "+fmt(oil.remaining)+" "+unitOf(car))+'</b></div>'+
            '<div class="pbar"><i class="'+(anim?"grow":"")+'" style="width:'+oil.pct.toFixed(0)+'%;background:'+toneVar(st)+';'+(anim?'animation-delay:'+(200+i*70)+'ms':'')+'"></i></div>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join("");
    var empty = !cars.length ? '<div class="empty"><div class="empty-ic">'+ICONS.car+'</div><b>Još nema vozila</b><span>Dodaj prvo vozilo tipkom + gore desno.</span></div>' : "";
    var html =
      '<header class="page-head">'+
        '<div><h1 class="'+enterCls(anim).trim()+'">Moja vozila</h1><p class="'+enterCls(anim).trim()+'"'+delay(anim,50)+'>'+state.cars.length+' '+plural(state.cars.length,"vozilo","vozila","vozila")+'</p></div>'+
        '<div class="head-actions">'+themeBtnHtml()+'<button class="icon-btn primary" id="addCarBtn" aria-label="Dodaj vozilo">'+ICONS.plus+'</button></div>'+
      '</header>'+
      typeFilter+
      '<div class="scroll" id="scrollArea">'+list+empty+'</div>';
    mount(html, direction);
    Array.prototype.forEach.call(screenBody.querySelectorAll("[data-vtype]"), function(b){
      b.addEventListener("click", function(){ state.vType = b.getAttribute("data-vtype"); render("fade"); });
    });
    if(anim) countUps(screenBody);
    wireThemeBtn();
    document.getElementById("addCarBtn").addEventListener("click", function(){ state.sheet = {mode:"add"}; render("none"); });

    Array.prototype.forEach.call(screenBody.querySelectorAll("[data-car-open]"), function(el){
      var id = el.getAttribute("data-car-open");
      var timer = null, long = false, sx = 0, sy = 0;
      el.addEventListener("pointerdown", function(e){
        long = false; sx = e.clientX; sy = e.clientY;
        timer = setTimeout(function(){ long = true; openCarActions(id); }, 480);
      });
      el.addEventListener("pointermove", function(e){
        if(timer && (Math.abs(e.clientX-sx) > 8 || Math.abs(e.clientY-sy) > 8)){ clearTimeout(timer); timer = null; }
      });
      ["pointerup","pointercancel","pointerleave"].forEach(function(ev){ el.addEventListener(ev, function(){ clearTimeout(timer); timer = null; }); });
      el.addEventListener("contextmenu", function(e){ e.preventDefault(); clearTimeout(timer); long = true; openCarActions(id); });
      el.addEventListener("click", function(e){
        if(long){ long = false; return; }
        if(e.target.closest("[data-car-more]")) return;
        openCar(id);
      });
    });
    Array.prototype.forEach.call(screenBody.querySelectorAll("[data-car-more]"), function(b){
      b.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
      b.addEventListener("click", function(e){ e.stopPropagation(); openCarActions(b.getAttribute("data-car-more")); });
    });
  }
  function openCar(id){
    state.selectedId = id; state.screen = "detail"; state.detailTab = "pregled"; state.prevDetailTab = "pregled";
    render("in");
  }

  // ===== Vehicle detail =====
  function renderDetail(direction){
    var car = carById(state.selectedId);
    if(!car){ state.screen = "home"; render("back"); return; }
    var anim = direction && direction !== "none" && !REDUCE_MOTION;
    var oil = oilRemaining(car), st = oilStatus(oil.remaining, car);
    var tab = state.detailTab || "pregled";

    navbarHost.innerHTML =
      '<div class="navbar">'+
        '<button class="back" id="backBtn">'+ICONS.back+'Vozila</button>'+
        '<button class="icon-btn sm" id="editCarBtn" aria-label="Uredi vozilo">'+ICONS.pencil+'</button>'+
      '</div>';
    document.getElementById("backBtn").addEventListener("click", function(){ state.screen = "home"; render("back"); });
    document.getElementById("editCarBtn").addEventListener("click", function(){ state.sheet = {mode:"edit", carId:car.id}; render("none"); });

    var seg = segHtml([["pregled","Pregled"],["gorivo","Gorivo"],["servisi","Servisi"],["podsjetnici","Podsjet."]], tab, state.prevDetailTab, "data-dtab");
    var sticky = '<div class="hero-sticky">'+
      '<div class="cc-name-row"><span class="id-dot" style="background:'+car.color+'"></span><span class="eyebrow">'+esc(car.make)+'</span></div>'+
      '<h2>'+car.year+'. '+esc(car.model)+'</h2>'+
      '<div class="hero-meta"><span class="plate-chip">'+esc(car.plate)+'</span></div>'+
      seg+
    '</div>';
    var photoBlock = "";
    if(tab === "pregled"){
      photoBlock = '<div class="detail-photo-wrap" id="detailPhotoWrap">'+
        (car.photo ? '<img class="detail-photo" src="'+car.photo+'" alt="">' : '<div class="detail-photo-fallback" style="background:'+car.color+'">'+initials(car.make,car.model)+'</div>')+
        '<div class="detail-photo-fade"></div></div>';
    }

    var tabAnim = anim || (state.prevDetailTab !== tab && !REDUCE_MOTION);
    var body;
    if(tab === "pregled") body = overviewHtml(car, oil, st, tabAnim);
    else if(tab === "gorivo") body = fuelTabHtml(car, tabAnim);
    else if(tab === "servisi") body = serviceTabHtml(car, oil, st, tabAnim);
    else body = remindersHtml(car.id, tabAnim);

    var html =
      (car.photo ? '<div class="backdrop" style="background-image:url('+car.photo+')"></div><div class="backdrop-veil"></div>' : '')+
      '<div class="scroll flush" id="scrollArea">'+photoBlock+sticky+'<div class="detail-pad'+enterCls(tabAnim)+'">'+body+'</div></div>';
    mount(html, direction);
    if(tabAnim) countUps(screenBody);
    state.prevDetailTab = tab;

    if(tab === "pregled" && direction === "in" && !REDUCE_MOTION){
      setTimeout(function(){
        if(state.screen !== "detail" || state.selectedId !== car.id || state.detailTab !== "pregled") return;
        var sa = document.getElementById("scrollArea"), ph = document.getElementById("detailPhotoWrap");
        if(sa && ph && sa.scrollTop < 10) sa.scrollTo({top:ph.offsetHeight, behavior:"smooth"});
      }, 2000);
    }
    Array.prototype.forEach.call(screenBody.querySelectorAll("[data-dtab]"), function(el){
      el.addEventListener("click", function(){
        if(el.getAttribute("data-dtab") === state.detailTab) return;
        state.detailTab = el.getAttribute("data-dtab");
        render("none");
      });
    });
    wireReminderCards();
    if(tab === "pregled") addFab(function(){
      openActionSheet('<b>Dodaj zapis</b>'+esc(shortModel(car)), [
        {label:"Točenje goriva", run:function(d, close){ close(function(){ openFuelSheet(car.id); }); }},
        {label:"Servis", run:function(d, close){ close(function(){ openServiceSheet(car.id); }); }},
        {label:"Ostali trošak", run:function(d, close){ close(function(){ openExpenseSheet(car.id); }); }}
      ]);
    }, "Dodaj zapis");
    if(tab === "gorivo") addFab(function(){ openFuelSheet(car.id); }, "Dodaj točenje");
    if(tab === "servisi") addFab(function(){ openServiceSheet(car.id); }, "Dodaj servis");
    if(tab === "podsjetnici") addFab(function(){ openReminderSheet(car.id); }, "Dodaj podsjetnik");
  }

  function row(icon, tone, label, value, sub){
    return '<div class="row"><div class="ic" style="background:var(--'+tone+'-soft);color:var(--'+tone+')">'+icon+'</div>'+
      '<div class="tt"><div class="t1">'+label+'</div>'+(sub?'<div class="t2">'+sub+'</div>':'')+'</div><div class="v">'+value+'</div></div>';
  }
  function overviewHtml(car, oil, st, anim){
    var reg = "";
    if(car.regDate){
      var d = daysUntil(car.regDate);
      var tone = d < 0 ? "danger" : d <= 30 ? "warn" : "ok";
      reg = '<span class="pill '+tone+'">'+(d<0 ? "kasni "+(-d)+" "+dana(d) : d===0 ? "danas" : "za "+d+" "+dana(d))+'</span>';
    }
    var stTone = st==="ok" ? "accent" : st;
    return '<div class="grouped">'+
        '<div class="row"><div class="ic" style="background:var(--accent-soft);color:var(--accent)">'+ICONS.gauge+'</div><div class="tt"><div class="t1">'+meterLabel(car)+'</div></div>'+
          '<div class="v big"'+(anim?countAttr(car.km,0," "+unitOf(car)):"")+'>'+fmt(car.km)+' '+unitOf(car)+'</div></div>'+
        '<div class="row"><div class="ic" style="background:var(--'+stTone+'-soft);color:var(--'+stTone+')">'+ICONS.drop+'</div><div class="tt"><div class="t1">Sljedeći servis</div><div class="t2">interval '+fmt(oil.interval)+' '+unitOf(car)+'</div></div>'+
          '<div class="v big" style="color:'+(st==="ok"?"var(--text)":toneVar(st))+'">'+(oil.remaining<=0 ? "Odmah" : fmt(oil.remaining)+' '+unitOf(car))+'</div></div>'+
      '</div>'+
      '<div class="sec-h">Podaci o vozilu</div>'+
      '<div class="grouped">'+
        row(ICONS.engine, "accent", "Motor", esc(car.engine))+
        row(ICONS.cal, "accent", "Godište", car.year+".")+
        row(ICONS.plate, "accent", "Tablica", esc(car.plate))+
        row(ICONS.doc, "accent", "Registracija do", car.regDate ? reg : '<span style="color:var(--text-3)">nije uneseno</span>', car.regDate ? fmtLong(car.regDate) : "")+
        row(ICONS.vin, "accent", "VIN", car.vin ? esc(car.vin) : '<span style="color:var(--text-3)">nije unesen</span>')+
      '</div>'+expensesHtml(car);
  }

  function kv(k, v){ return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
  function fuelTabHtml(car, anim){
    var logs = car.fuelLogs || [];
    if(!logs.length) return '<div class="empty"><div class="empty-ic">'+ICONS.fuel+'</div><b>Nema točenja</b><span>Dodaj prvo točenje tipkom + dolje desno.</span></div>';
    var totalCost = logs.reduce(function(s,l){ return s+Number(l.total||0); }, 0);
    var totalL = logs.reduce(function(s,l){ return s+Number(l.liters||0); }, 0);
    var tripSum = logs.reduce(function(s,l){ return s+Number(l.tripKm||0); }, 0);
    var tripL = logs.filter(function(l){ return l.tripKm; }).reduce(function(s,l){ return s+Number(l.liters||0); }, 0);
    var avg = tripSum ? tripL/tripSum*(isHours(car) ? 1 : 100) : 0;
    var metrics = '<div class="metrics">'+
      '<div class="metric"><div class="kicker">Ukupno</div><div class="val"'+(anim?countAttr(totalCost,0," "+CUR()):"")+'>'+numFmt(totalCost,0)+' '+CUR()+'</div></div>'+
      '<div class="metric"><div class="kicker">'+(VOL()==="gal" ? "Galona" : "Litara")+'</div><div class="val"><span'+(anim?countAttr(totalL,0,""):"")+'>'+numFmt(totalL,0)+'</span><span class="unit">'+VOL()+'</span></div></div>'+
      '<div class="metric"><div class="kicker">Prosjek</div><div class="val"><span'+(anim?countAttr(avg,1,""):"")+'>'+numFmt(avg,1)+'</span><span class="unit">'+(isHours(car) ? VOL()+"/h" : VOL()+"/100")+'</span></div></div>'+
    '</div>';
    var cards = logs.map(function(l){
      return '<div class="log-card">'+
        '<div class="lc-head">'+
          '<div><div class="lc-date">'+fmtLong(l.date)+'</div><div class="lc-when" style="text-transform:capitalize">'+weekday(l.date)+'</div></div>'+
          '<div class="lc-amt"><span class="kicker">Ukupno</span><b style="color:var(--fuel)">'+money(l.total)+'</b></div>'+
        '</div>'+
        kv("Potrošeno "+volWord(), numFmt(l.liters,1)+" "+VOL())+
        kv("Cijena goriva", money(l.price))+
        kv(isHours(car) ? "Radnih sati s ovim spremnikom" : "Prijeđeno s ovim spremnikom", l.tripKm ? fmt(l.tripKm)+" "+unitOf(car) : "—")+
        kv("Prosječna potrošnja", l.avgConsumption ? numFmt(l.avgConsumption,1)+" "+consUnit(car) : "—")+
        kv(isHours(car) ? "Trenutni radni sati" : "Trenutna kilometraža", fmt(l.km)+" "+unitOf(car))+
        kv("Benzinska", l.place ? esc(l.place) : "—")+
        kv("Vrsta goriva", l.fuelType ? esc(l.fuelType) : "—")+
      '</div>';
    }).join("");
    return metrics+'<div class="sec-h">Povijest točenja</div>'+cards;
  }

  function serviceTabHtml(car, oil, st, anim){
    var oilCard = '<div class="card">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'+
        '<div><div class="kicker">Mali servis</div><div style="font-size:20px;font-weight:700;letter-spacing:-.015em;margin-top:6px;color:'+(st==="ok"?"var(--text)":toneVar(st))+'">'+(oil.remaining<=0 ? "Servis je dospio" : "još "+fmt(oil.remaining)+" "+unitOf(car))+'</div></div>'+
        '<div style="text-align:right;font-size:12.5px;color:var(--text-2)">interval<br><b style="color:var(--text);font-size:14px">'+fmt(oil.interval)+' '+unitOf(car)+'</b></div>'+
      '</div>'+
      '<div class="pbar" style="margin-top:14px"><i class="'+(anim?"grow":"")+'" style="width:'+oil.pct.toFixed(0)+'%;background:'+toneVar(st)+'"></i></div>'+
      '<div style="font-size:12.5px;color:var(--text-2);margin-top:8px">'+fmt(Math.max(0,oil.used))+' '+unitOf(car)+' od zadnje zamjene ulja</div>'+
    '</div>';
    var logs = car.serviceLogs || [];
    if(!logs.length) return oilCard+'<div class="empty"><div class="empty-ic">'+ICONS.wrench+'</div><b>Nema servisa</b><span>Dodaj prvi servis tipkom + dolje desno.</span></div>';
    var cards = logs.map(function(l){
      var types = l.types || [];
      return '<div class="log-card">'+
        '<div class="lc-head">'+
          '<div><div class="lc-date">'+fmtLong(l.date)+'</div><div class="lc-when" style="text-transform:capitalize">'+weekday(l.date)+'</div></div>'+
          '<div class="lc-amt"><span class="kicker">Trošak</span><b style="color:var(--service)">'+(l.price ? money(l.price) : "—")+'</b></div>'+
        '</div>'+
        (types.length ? '<div class="lc-tags tags">'+types.map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join("")+'</div>' : '')+
        kv(meterLabel(car), fmt(l.km)+" "+unitOf(car))+
        (l.desc ? kv("Bilješke", esc(l.desc)) : "")+
      '</div>';
    }).join("");
    return oilCard+'<div class="sec-h">Povijest servisa</div>'+cards;
  }

  // ===== Reminders =====
  function remCardHtml(it, i, anim){
    return '<button class="rem-card'+enterCls(anim)+'" data-rem="'+esc(it.key)+'"'+delay(anim, 60+i*45)+'>'+
      '<span class="rem-av">'+ringAvatar(it.car, 36)+'<span class="ty">'+typeIcon(it.title)+'</span></span>'+
      '<span class="rem-tt"><span class="rem-title" style="display:block">'+esc(it.title)+(it.kind!=="stored"?'<span class="auto">auto</span>':'')+'</span>'+
        '<span class="rem-sub" style="display:block">'+esc(shortModel(it.car))+' · '+it.when+'</span></span>'+
      '<span class="pill '+it.status+'">'+it.label+'</span>'+
    '</button>';
  }
  function remindersHtml(carId, anim){
    var items = reminderItems(carId);
    if(!items.length) return '<div class="empty"><div class="empty-ic">'+ICONS.bell+'</div><b>Nema podsjetnika</b><span>Dodaj rok za osiguranje, gume ili bilo što drugo.</span></div>';
