  // ===== Statistics =====
  var CAT_KEYS = ["fuel","service","other"];
  var CAT_META = {
    fuel:{label:"Gorivo", color:"var(--fuel)", soft:"var(--fuel-soft)"},
    service:{label:"Servis", color:"var(--service)", soft:"var(--service-soft)"},
    other:{label:"Ostalo", color:"var(--other)", soft:"var(--other-soft)"}
  };
  function fullName(car){ return car.year+". "+String(car.make||"").replace(/-Benz$/,"")+" "+car.model; }
  function expenseIcon(cat){
    if(cat==="Registracija") return ICONS.doc;
    if(cat==="Osiguranje") return ICONS.shield;
    if(cat==="Pranje") return ICONS.drop;
    return ICONS.plate;
  }
  function svcLabel(log){
    var t = log.types || [];
    if(t.indexOf("Zamjena ulja") !== -1) return "Mali servis";
    if(!t.length) return "Servis";
    return t[0]+(t.length>1 ? " +"+(t.length-1) : "");
  }
  function itemLabel(it){ return it.kind==="fuel" ? "Točenje goriva" : it.kind==="service" ? svcLabel(it.log) : it.log.cat; }
  // every cost record whose date starts with prefix ("2026" or "2026-10"), optionally for one car
  function scopedCars(){ return state.sType === "all" ? state.cars : state.cars.filter(function(c){ return c.type === state.sType; }); }
  function costItems(prefix, carId){
    var out = [];
    scopedCars().forEach(function(car){
      if(carId && carId !== "all" && car.id !== carId) return;
      car.fuelLogs.forEach(function(l){ if(l.date && l.date.indexOf(prefix)===0) out.push({kind:"fuel", car:car, date:l.date, amount:Number(l.total||0), log:l}); });
      car.serviceLogs.forEach(function(l){ if(l.date && l.date.indexOf(prefix)===0) out.push({kind:"service", car:car, date:l.date, amount:Number(l.price||0), log:l}); });
      (car.expenses||[]).forEach(function(l){ if(l.date && l.date.indexOf(prefix)===0) out.push({kind:"other", car:car, date:l.date, amount:Number(l.amount||0), log:l}); });
    });
    return out;
  }
  // km actually driven in a period: last odometer reading in it minus the last reading before it
  // (or the first reading inside it when there is no earlier one); engine-hour vehicles are left out
  function distanceIn(car, prefix){
    var rs = car.fuelLogs.concat(car.serviceLogs).filter(function(l){ return l.date && l.km; });
    var inP = rs.filter(function(l){ return l.date.indexOf(prefix)===0; });
    if(!inP.length) return 0;
    var end = Math.max.apply(null, inP.map(function(l){ return l.km; }));
    var before = rs.filter(function(l){ return l.date < prefix; });
    var start = before.length ? Math.max.apply(null, before.map(function(l){ return l.km; })) : Math.min.apply(null, inP.map(function(l){ return l.km; }));
    return Math.max(0, end-start);
  }
  function sumBy(items, kind){ return items.reduce(function(s, it){ return s+(kind && it.kind!==kind ? 0 : it.amount); }, 0); }
  function catVals(items){ return {fuel:sumBy(items,"fuel"), service:sumBy(items,"service"), other:sumBy(items,"other")}; }
  // one bar split by share of cost; smallest share sits at the bottom
  function stackBg(v){
    var t = v.fuel+v.service+v.other;
    var parts = CAT_KEYS.map(function(k){ return {c:CAT_META[k].color, p:t ? v[k]/t*100 : 0}; })
      .filter(function(p){ return p.p>0; }).sort(function(a,b){ return a.p-b.p; });
    if(!parts.length) return "var(--fill)";
    if(parts.length===1) return parts[0].c;
    var acc = 0, stops = [];
    parts.forEach(function(pt){ stops.push(pt.c+" "+acc.toFixed(2)+"%", pt.c+" "+(acc+pt.p).toFixed(2)+"%"); acc += pt.p; });
    return "linear-gradient(to top, "+stops.join(", ")+")";
  }
  function latestDataMonth(){
    var best = null;
    state.cars.forEach(function(c){
      c.fuelLogs.concat(c.serviceLogs, c.expenses||[]).forEach(function(l){ if(l.date && (!best || l.date > best)) best = l.date; });
    });
    if(!best) return currentMonthObj();
    return {y:+best.slice(0,4), m:+best.slice(5,7)-1};
  }
  function expensesHtml(car){
    var ex = (car.expenses||[]).slice(0,4);
    if(!ex.length) return "";
    return '<div class="sec-h">Ostali troškovi</div><div class="grouped">'+ex.map(function(e){
      return '<div class="row"><div class="ic" style="background:var(--other-soft);color:var(--other)">'+expenseIcon(e.cat)+'</div>'+
        '<div class="tt"><div class="t1">'+esc(e.cat)+'</div><div class="t2">'+fmtDate(e.date)+(e.note ? ' · '+esc(e.note) : '')+'</div></div>'+
        '<div class="v" style="color:var(--text);font-weight:600">'+money(e.amount)+'</div></div>';
    }).join("")+'</div>';
  }
  function accItem(icon, kind, t1, t2, amount){
    return '<div class="acc-item"><div class="ic" style="background:'+CAT_META[kind].soft+';color:'+CAT_META[kind].color+'">'+icon+'</div>'+
      '<div class="tt"><div class="t1">'+esc(t1)+'</div><div class="t2">'+esc(t2)+'</div></div><div class="v">'+money(amount)+'</div></div>';
  }
  function byDate(a, b){ return a.date.localeCompare(b.date); }
  function accHtml(x){
    var open = !!state.statsOpen[x.car.id];
    var lines = "";
    var fuel = x.items.filter(function(it){ return it.kind==="fuel"; });
    if(fuel.length){
      var L = fuel.reduce(function(s, it){ return s+Number(it.log.liters||0); }, 0);
      var km = fuel.reduce(function(s, it){ return s+Number(it.log.tripKm||0); }, 0);
      lines += accItem(ICONS.fuel, "fuel", "Gorivo", fuel.length+" "+plural(fuel.length,"točenje","točenja","točenja")+" · "+numFmt(L,0)+" "+VOL()+(km ? " · "+fmt(km)+" "+unitOf(x.car) : ""), x.vals.fuel);
    }
    x.items.filter(function(it){ return it.kind==="service"; }).sort(byDate).forEach(function(it){
      lines += accItem(ICONS.wrench, "service", svcLabel(it.log), fmtDate(it.date)+(it.log.desc ? " · "+it.log.desc : ""), it.amount);
    });
    x.items.filter(function(it){ return it.kind==="other"; }).sort(byDate).forEach(function(it){
      lines += accItem(expenseIcon(it.log.cat), "other", it.log.cat, fmtDate(it.date)+(it.log.note ? " · "+it.log.note : ""), it.amount);
    });
    var n = x.items.length;
    return '<div class="acc'+(open?' open':'')+'" data-acc="'+x.car.id+'">'+
      '<button type="button" class="acc-head" aria-expanded="'+open+'">'+ringAvatar(x.car, 34)+
        '<span class="acc-tt"><span class="acc-name">'+esc(fullName(x.car))+'</span><span class="acc-sub">'+money(x.total)+' · '+n+' '+plural(n,"stavka","stavke","stavki")+'</span></span>'+
        '<span class="acc-chev">'+ICONS.chev+'</span></button>'+
      '<div class="acc-body"><div class="acc-inner"><div class="acc-list">'+lines+'</div></div></div></div>';
  }

  function renderStatsTab(direction){
    navbarHost.innerHTML = "";
    if(!state.statsMonth) state.statsMonth = latestDataMonth();
    if(!state.statsYear) state.statsYear = state.statsMonth.y;
    var cur = state.statsMonth;
    var monthItems = costItems(cur.y+"-"+pad2(cur.m+1));
    var perCar = scopedCars().map(function(car){
      var its = monthItems.filter(function(it){ return it.car===car; });
      var v = catVals(its);
      return {car:car, items:its, vals:v, total:v.fuel+v.service+v.other};
    }).filter(function(x){ return x.items.length; });

    var body, targets = [];
    var BAR_MAX = 150, AV = 38, AV_GAP = 8, VAL_GAP = 13; // VAL_GAP includes the ring padding+border
    if(!perCar.length){
      body = '<div class="empty"><div class="empty-ic">'+ICONS.bars+'</div><b>Nema podataka</b><span>Za ovaj mjesec nema zabilježenih troškova. Prelistaj druge mjesece.</span></div>';
    } else {
      var monthTotal = perCar.reduce(function(s,x){ return s+x.total; }, 0);
      var maxTotal = Math.max.apply(null, perCar.map(function(x){ return x.total; }).concat([1]));
      var legend = '<div class="legend-row">'+CAT_KEYS.map(function(k){ return '<span class="li"><span class="dot" style="background:'+CAT_META[k].color+'"></span>'+CAT_META[k].label+'</span>'; }).join("")+'</div>';
      var n = perCar.length;
      var avail = document.getElementById("screenInner").clientWidth - 32;
      var gap = n <= 3 ? 20 : n <= 4 ? 14 : n <= 6 ? 8 : 5;
      var colW = Math.min(76, Math.floor((avail - gap*(n-1))/n));
      AV = Math.max(18, Math.min(38, colW-14));
      var inset = colW >= 60 ? 8 : Math.max(2, Math.round(colW*0.08));
      var small = colW < 52;
      var cols = perCar.map(function(x, i){
        var barPx = Math.max(14, (x.total/maxTotal)*BAR_MAX);
        targets.push({i:i, barPx:barPx});
        return '<div class="sc-col" style="width:'+colW+'px">'+
          '<div class="sc-chart" style="width:'+colW+'px;height:'+(BAR_MAX+AV_GAP+AV+VAL_GAP+22)+'px">'+
            '<div class="sc-val" id="scVal'+i+'" style="bottom:'+(AV_GAP+AV+VAL_GAP)+'px'+(small ? ';font-size:'+(colW < 40 ? 10 : 11.5)+'px' : '')+'"'+countAttr(Math.round(x.total),0,small ? "" : " "+CUR())+'>'+fmt(x.total)+(small ? '' : ' '+CUR())+'</div>'+
            '<div class="sc-avatar car-ring" id="scAvt'+i+'" style="bottom:'+AV_GAP+'px;border-color:'+x.car.color+(AV < 28 ? ';border-width:1.5px;padding:1px' : '')+'">'+avatarHtml(x.car,AV)+'</div>'+
            '<div class="sc-bar" id="scBar'+i+'" style="height:0;left:'+inset+'px;right:'+inset+'px;'+(colW < 40 ? 'border-radius:8px 8px 3px 3px;' : '')+'background:'+stackBg(x.vals)+'"></div>'+
          '</div>'+
          (colW >= 44 ? '<div class="sc-name"'+(small ? ' style="font-size:10px"' : '')+'>'+esc(shortModel(x.car))+'</div>' : '')+
        '</div>';
      }).join("");
      var totalCard = '<div class="card total-card"><div class="kicker">Ukupno potrošeno ovaj mjesec</div><div class="amt"'+countAttr(monthTotal,2," "+CUR())+'>'+money(monthTotal)+'</div></div>';
      body = legend+'<div class="sc-chart-row" style="gap:'+gap+'px">'+cols+'</div>'+totalCard+
        '<div class="sec-h">Individualni mjesečni troškovi</div><div class="grouped">'+perCar.map(accHtml).join("")+'</div>';
    }
    var nav = '<div class="month-nav"><button class="round-btn" id="statsPrev" aria-label="Prethodni mjesec">'+ICONS.back+'</button><span class="lbl">'+MONTH_NAMES[cur.m]+' '+cur.y+'.</span><button class="round-btn" id="statsNext" aria-label="Sljedeći mjesec">'+ICONS.chev+'</button></div>';
    var types = VEHICLE_TYPES.filter(function(t){ return state.cars.some(function(c){ return c.type===t.id; }); });
    if(types.length < 2 || !types.some(function(t){ return t.id===state.sType; })) state.sType = "all";
    var typeFilter = types.length < 2 ? "" : '<div class="chip-scroll" style="margin-top:4px;margin-bottom:6px"><button type="button" class="chip'+(state.sType==="all"?' on':'')+'" data-stype="all">Sva vozila</button>'+
      types.map(function(t){ return '<button type="button" class="chip'+(state.sType===t.id?' on':'')+'" data-stype="'+t.id+'">'+t.icon+t.label+'</button>'; }).join("")+'</div>';
    mount('<div class="scroll" id="scrollArea" style="padding-top:2px">'+typeFilter+'<div class="sec-h first">Mjesečni troškovi</div>'+nav+body+
      '<div class="sec-h" style="margin-top:34px">Godišnji troškovi</div><div id="yearSec"></div></div>', direction);
    countUps(screenBody);
    targets.forEach(function(t){
      setTimeout(function(){
        var bar = document.getElementById("scBar"+t.i), avt = document.getElementById("scAvt"+t.i), val = document.getElementById("scVal"+t.i);
        if(bar) bar.style.height = t.barPx+"px";
        if(avt) avt.style.bottom = (t.barPx+AV_GAP)+"px";
        if(val) val.style.bottom = (t.barPx+AV_GAP+AV+VAL_GAP)+"px";
      }, 100 + t.i*120);
    });
    document.getElementById("statsPrev").addEventListener("click", function(){
      var c = {y:cur.y, m:cur.m-1}; if(c.m<0){ c.m = 11; c.y--; }
      state.statsMonth = c; render("none");
    });
    document.getElementById("statsNext").addEventListener("click", function(){
      var c = {y:cur.y, m:cur.m+1}; if(c.m>11){ c.m = 0; c.y++; }
      state.statsMonth = c; render("none");
    });
    Array.prototype.forEach.call(screenBody.querySelectorAll("[data-acc]"), function(el){
      var head = el.querySelector(".acc-head");
      head.addEventListener("click", function(){
        var id = el.getAttribute("data-acc");
        state.statsOpen[id] = !state.statsOpen[id];
        el.classList.toggle("open", state.statsOpen[id]);
        head.setAttribute("aria-expanded", state.statsOpen[id] ? "true" : "false");
      });
    });
    Array.prototype.forEach.call(screenBody.querySelectorAll("[data-stype]"), function(b){
      b.addEventListener("click", function(){ state.sType = b.getAttribute("data-stype"); render("none"); });
    });
    renderYearSection(true);
  }

  // yearly overview with category + vehicle filters; re-renders only its own container
  function renderYearSection(anim){
    var host = document.getElementById("yearSec"); if(!host) return;
    anim = anim && !REDUCE_MOTION;
    var y = state.statsYear, cat = state.yCat;
    if(state.yCar !== "all" && !scopedCars().some(function(c){ return c.id===state.yCar; })) state.yCar = "all";
    var carF = state.yCar;
    var all = costItems(String(y), carF);
    var items = cat === "all" ? all : all.filter(function(it){ return it.kind === cat; });
    var total = sumBy(items);

    var html = '<div class="month-nav"><button class="round-btn" id="yrPrev" aria-label="Prethodna godina">'+ICONS.back+'</button><span class="lbl">'+y+'.</span><button class="round-btn" id="yrNext" aria-label="Sljedeća godina">'+ICONS.chev+'</button></div>'+
      segHtml([["all","Sve"],["fuel","Gorivo"],["service","Servis"],["other","Ostalo"]], cat, state.yCatPrev, "data-ycat")+
      '<div class="chip-scroll"><button type="button" class="chip'+(carF==="all"?' on':'')+'" data-ycar="all" style="padding:7px 14px">Sva vozila</button>'+
        scopedCars().map(function(c){ return '<button type="button" class="chip car'+(carF===c.id?' on':'')+'" data-ycar="'+c.id+'">'+avatarHtml(c,24)+esc(shortModel(c))+'</button>'; }).join("")+
      '</div>';

    if(!items.length){
      html += '<div class="empty" style="padding:40px 24px"><div class="empty-ic">'+ICONS.bars+'</div><b>Nema troškova</b><span>Za '+y+'. nema zapisa s odabranim filtrima.</span></div>';
    } else {
      var months = [];
      for(var m=0; m<12; m++){
        var p = y+"-"+pad2(m+1);
        var v = catVals(items.filter(function(it){ return it.date.indexOf(p)===0; }));
        months.push({v:v, t:v.fuel+v.service+v.other});
      }
      var maxM = Math.max.apply(null, months.map(function(mo){ return mo.t; }).concat([1]));
      var peak = months.reduce(function(bi, mo, i){ return mo.t > months[bi].t ? i : bi; }, 0);
      var active = months.filter(function(mo){ return mo.t>0; }).length;
      var sel = state.statsMonth && state.statsMonth.y === y ? state.statsMonth.m : -1;
      var chart = '<div class="yr-chart'+(sel>=0 && months[sel].t ? ' has-sel' : '')+'">'+months.map(function(mo, i){
        var h = mo.t ? Math.max(4, mo.t/maxM*92) : 3;
        return '<button type="button" class="yr-col'+(i===sel?' sel':'')+'" data-ym="'+i+'" aria-label="'+MONTH_NAMES[i]+' '+money(mo.t)+'">'+
          '<i class="yr-bar'+(mo.t?'':' zero')+(anim && mo.t?' grow':'')+'" style="height:'+h.toFixed(1)+'px;'+(mo.t ? 'background:'+stackBg(mo.v)+';' : '')+(anim ? 'animation-delay:'+(i*30)+'ms' : '')+'"></i>'+
          '<span class="yr-lbl">'+MONTH_SHORT[i]+'</span></button>';
      }).join("")+'</div>';
      html += '<div class="card" style="margin-top:14px">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">'+
          '<div><div class="kicker">Ukupno '+y+'.</div><div class="yr-total"'+(anim ? countAttr(total,2," "+CUR()) : '')+'>'+money(total)+'</div></div>'+
          '<div class="yr-avg">prosječno<br><b>'+money(active ? total/active : 0)+'</b> / mj.</div>'+
        '</div>'+chart+
        '<div class="yr-peak">Najskuplji mjesec: <b>'+MONTH_NAMES[peak]+'</b> · '+money(months[peak].t)+'</div>'+
      '</div>';

      // distance/engine hours from meter readings; consumption from fuel logs; road and hour-counted vehicles kept apart
      var fuel = all.filter(function(it){ return it.kind==="fuel"; });
      var inScope = scopedCars().filter(function(c){ return carF==="all" || c.id===carF; });
      function unitGroup(hours){
        var cars = inScope.filter(function(c){ return isHours(c) === hours && all.some(function(it){ return it.car===c; }); });
        var g = {present:cars.length>0, dist:0, cost:0, Ltrip:0, trip:0};
        cars.forEach(function(c){ g.dist += distanceIn(c, String(y)); });
        g.cost = sumBy(items.filter(function(it){ return isHours(it.car) === hours; }));
        fuel.forEach(function(it){ if(isHours(it.car) === hours && it.log.tripKm){ g.Ltrip += Number(it.log.liters||0); g.trip += Number(it.log.tripKm); } });
        return g;
      }
      var road = unitGroup(false), hrs = unitGroup(true);
      var L = fuel.reduce(function(sum, it){ return sum+Number(it.log.liters||0); }, 0);
      var nSvc = all.filter(function(it){ return it.kind==="service"; }).length;
      function kpi(label, value, unit){ return '<div class="kpi"><div class="kicker">'+label+'</div><div class="val">'+value+(unit ? '<span class="unit">'+unit+'</span>' : '')+'</div></div>'; }
      var dU = DIST();
      var kRoad = kpi("Prijeđeno", fmt(road.dist), dU)+kpi("Trošak po "+dU, road.dist ? numFmt(road.cost/road.dist,2) : "—", road.dist ? CUR()+"/"+dU : "");
      var kHrs = kpi("Radni sati", fmt(hrs.dist), "h")+kpi("Trošak po satu", hrs.dist ? numFmt(hrs.cost/hrs.dist,2) : "—", hrs.dist ? CUR()+"/h" : "");
      var tiles;
      if(road.present && hrs.present) tiles = kRoad+kHrs+kpi("Natočeno", fmt(L), VOL())+kpi("Servisa", String(nSvc), "");
      else if(hrs.present) tiles = kHrs+kpi("Potrošnja", hrs.trip ? numFmt(hrs.Ltrip/hrs.trip,1) : "—", hrs.trip ? VOL()+"/h" : "")+kpi("Natočeno", fmt(L), VOL())+kpi("Točenja", String(fuel.length), "")+kpi("Servisa", String(nSvc), "");
      else tiles = kRoad+kpi("Potrošnja", road.trip ? numFmt(road.Ltrip/road.trip*100,1) : "—", road.trip ? VOL()+"/100 "+dU : "")+kpi("Natočeno", fmt(L), VOL())+kpi("Točenja", String(fuel.length), "")+kpi("Servisa", String(nSvc), "");
      html += '<div class="kpi-grid">'+tiles+'</div>';

      if(cat === "all"){
        var cv = catVals(items);
        html += '<div class="sec-h">Raspodjela troškova</div><div class="card">'+
          '<div class="split">'+CAT_KEYS.filter(function(k){ return cv[k]>0; }).map(function(k){ return '<i style="flex:'+cv[k].toFixed(2)+';background:'+CAT_META[k].color+'"></i>'; }).join("")+'</div>'+
          CAT_KEYS.map(function(k){
            return '<div class="lg-row"><span class="dot" style="background:'+CAT_META[k].color+'"></span><span class="nm">'+CAT_META[k].label+'</span>'+
              '<span class="pct">'+numFmt(total ? cv[k]/total*100 : 0, 0)+' %</span><b>'+money(cv[k])+'</b></div>';
          }).join("")+
        '</div>';
      }
      if(carF === "all"){
        var perC = scopedCars().map(function(car){
          var t = sumBy(items.filter(function(it){ return it.car===car; }));
          var kmC = distanceIn(car, String(y));
          return {car:car, t:t, km:kmC};
        }).filter(function(x){ return x.t>0; }).sort(function(a,b){ return b.t-a.t; });
        if(perC.length){
          var maxC = perC[0].t;
          html += '<div class="sec-h">Po vozilu</div><div class="grouped">'+perC.map(function(x, i){
            return '<div class="share-row">'+ringAvatar(x.car, 30)+'<div class="share-tt">'+
              '<div class="share-top"><span>'+esc(shortModel(x.car))+'</span><span>'+money(x.t)+'</span></div>'+
              '<div class="pbar" style="margin-top:7px"><i class="'+(anim?'grow':'')+'" style="width:'+(x.t/maxC*100).toFixed(1)+'%;background:'+x.car.color+';'+(anim ? 'animation-delay:'+(120+i*80)+'ms' : '')+'"></i></div>'+
              '<div class="share-sub"><span>'+numFmt(x.t/total*100,0)+' % ukupnog</span><span>'+(x.km ? numFmt(x.t/x.km,2)+' '+CUR()+'/'+unitOf(x.car) : '')+'</span></div>'+
            '</div></div>';
          }).join("")+'</div>';
        }
      }
      var top = items.slice().sort(function(a,b){ return b.amount-a.amount; }).slice(0,3);
      html += '<div class="sec-h">Najveći pojedinačni troškovi</div><div class="grouped">'+top.map(function(it){
        return '<div class="row">'+ringAvatar(it.car, 30)+'<div class="tt"><div class="t1">'+esc(itemLabel(it))+'</div><div class="t2">'+esc(shortModel(it.car))+' · '+fmtDate(it.date)+'</div></div>'+
          '<div class="v" style="color:var(--text);font-weight:600">'+money(it.amount)+'</div></div>';
      }).join("")+'</div>';
    }
    host.innerHTML = html;
    settleSegs(host);
    state.yCatPrev = cat;
    if(anim) countUps(host);
    var chipRow = host.querySelector(".chip-scroll"), onChip = chipRow && chipRow.querySelector(".chip.on");
    if(onChip) chipRow.scrollLeft = Math.max(0, onChip.offsetLeft - 16);

    document.getElementById("yrPrev").addEventListener("click", function(){ state.statsYear--; renderYearSection(true); });
    document.getElementById("yrNext").addEventListener("click", function(){ state.statsYear++; renderYearSection(true); });
    Array.prototype.forEach.call(host.querySelectorAll("[data-ycat]"), function(b){
      b.addEventListener("click", function(){
        if(b.getAttribute("data-ycat") === state.yCat) return;
        state.yCat = b.getAttribute("data-ycat"); renderYearSection(true);
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll("[data-ycar]"), function(b){
      b.addEventListener("click", function(){ state.yCar = b.getAttribute("data-ycar"); renderYearSection(true); });
    });
    Array.prototype.forEach.call(host.querySelectorAll("[data-ym]"), function(b){
      b.addEventListener("click", function(){ state.statsMonth = {y:y, m:+b.getAttribute("data-ym")}; render("none"); });
    });
  }

  // ---------- sheets ----------
  function closeLayer(layer, cb){
    if(!layer || !layer.parentNode){ if(cb) cb(); return; }
    if(REDUCE_MOTION){ layer.remove(); if(cb) cb(); return; }
    layer.classList.add("closing");
    setTimeout(function(){ layer.remove(); if(cb) cb(); }, 250);
  }
  function group(title, inner, first){ return (title ? '<div class="sec-h'+(first?' first':'')+'">'+title+'</div>' : '')+'<div class="form-group">'+inner+'</div>'; }
  function field(id, label, placeholder, type){
    return '<div class="field"><label class="fl" for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" placeholder="'+esc(placeholder)+'" autocomplete="off"'+(type==="number"?' inputmode="decimal"':'')+'></div>';
  }
  function dateField(id, label, iso, emptyText){
    return '<div class="field tappable" id="'+id+'Field"><div class="fl">'+label+'</div><div class="fv'+(iso?'':' ph')+'" id="'+id+'Display">'+(iso ? fmtLong(iso) : (emptyText||"Odaberi datum"))+'</div></div>';
  }
  function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }
  function setVal(id, v){ var el = document.getElementById(id); if(el) el.value = v==null ? "" : v; }
  function randColor(){
    var used = state.cars.map(function(c){ return c.color; });
    var free = CAR_PALETTE.filter(function(c){ return used.indexOf(c) === -1; });
    var pool = free.length ? free : CAR_PALETTE;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function openSheet(title, bodyHtml, onSave, opts){
    opts = opts || {};
    var existing = document.getElementById("genericSheet");
    if(existing) existing.remove();
    var layer = document.createElement("div");
    layer.className = "sheet-wrap"; layer.id = "genericSheet";
    layer.innerHTML =
      '<div class="sheet-scrim" id="gScrim"></div>'+
      '<div class="sheet" role="dialog" aria-label="'+esc(title)+'"><div class="grab"></div>'+
        '<div class="sh-top"><button class="navbtn" id="gCancel">'+(opts.cancelLabel||"Odustani")+'</button><h3>'+title+'</h3>'+
          (opts.noSave ? '<span></span>' : '<button class="navbtn strong" id="gSave">'+(opts.saveLabel||"Spremi")+'</button>')+'</div>'+
        '<div class="sheet-body">'+bodyHtml+'</div>'+
      '</div>';
    document.getElementById("screenInner").appendChild(layer);
    function close(cb){ closeLayer(layer, cb); }
    document.getElementById("gScrim").addEventListener("click", function(){ close(); });
    document.getElementById("gCancel").addEventListener("click", function(){ close(); });
    if(!opts.noSave) document.getElementById("gSave").addEventListener("click", function(){ onSave(close); });
    return {layer:layer, close:close};
  }

  function openActionSheet(titleHtml, actions){
    var existing = document.getElementById("actSheet");
    if(existing) existing.remove();
    var layer = document.createElement("div");
    layer.className = "sheet-wrap"; layer.id = "actSheet";
    function draw(title, acts){
      layer.innerHTML = '<div class="sheet-scrim" data-act-close></div>'+
        '<div class="act-sheet" role="dialog">'+
          '<div class="act-group">'+(title ? '<div class="act-title">'+title+'</div>' : '')+
            acts.map(function(a, i){ return '<button class="act-btn'+(a.danger?' danger':'')+'" data-act="'+i+'">'+a.label+'</button>'; }).join("")+
          '</div>'+
          '<div class="act-group"><button class="act-btn cancel" data-act-close>Odustani</button></div>'+
        '</div>';
      Array.prototype.forEach.call(layer.querySelectorAll("[data-act-close]"), function(el){ el.addEventListener("click", function(){ closeLayer(layer); }); });
      Array.prototype.forEach.call(layer.querySelectorAll("[data-act]"), function(el){
        el.addEventListener("click", function(){ acts[+el.getAttribute("data-act")].run(draw, function(cb){ closeLayer(layer, cb); }); });
      });
    }
    draw(titleHtml, actions);
    document.getElementById("screenInner").appendChild(layer);
  }

  function deleteCar(id){
    var car = carById(id);
    state.cars = state.cars.filter(function(c){ return c.id !== id; });
    state.reminders = state.reminders.filter(function(r){ return r.carId !== id; });
    saveCars(); saveReminders();
    if(state.selectedId === id){ state.screen = "home"; state.selectedId = null; }
    toast((car ? shortModel(car) : "Vozilo")+" obrisano");
  }
  function openCarActions(id){
    var car = carById(id); if(!car) return;
    var title = '<b>'+esc(car.make)+' '+esc(car.model)+'</b>'+esc(car.plate);
    openActionSheet(title, [
      {label:"Otvori vozilo", run:function(draw, close){ close(function(){ openCar(id); }); }},
      {label:"Uredi vozilo", run:function(draw, close){ close(function(){ state.sheet = {mode:"edit", carId:id}; render("none"); }); }},
      {label:"Obriši vozilo", danger:true, run:function(draw, close){
        draw('<b>Obrisati '+esc(shortModel(car))+'?</b>Brišu se i sva točenja, servisi i podsjetnici za ovo vozilo.', [
          {label:"Obriši vozilo", danger:true, run:function(d2, close2){ close2(function(){ deleteCar(id); render("none"); }); }}
        ]);
      }}
    ]);
  }

  // add / edit vehicle
  function closeSheet(){
    var l = document.getElementById("sheetLayer");
    closeLayer(l, function(){ state.sheet = null; render("none"); });
  }
  function renderFormSheet(){
    var existingLayer = document.getElementById("sheetLayer");
    if(existingLayer) existingLayer.remove();
    if(!state.sheet) return;
    var isEdit = state.sheet.mode === "edit";
    var car = isEdit ? carById(state.sheet.carId) : null;
    if(isEdit && !car){ state.sheet = null; return; }
    var photoData = isEdit ? (car.photo || null) : null;
    var regDate = isEdit ? (car.regDate || "") : "";
    var vtype = isEdit ? (car.type || "auto") : "";
    var unit = isEdit && car.unit === "h" ? "h" : "km";
    function typeFieldInner(){
      return '<div class="fl">Tip vozila</div>'+(vtype ? '<div class="fv fv-type">'+vType(vtype).icon+vType(vtype).label+'</div>' : '<div class="fv ph">Izaberi tip vozila</div>');
    }

    function photoRow(){
      return (photoData ? '<img class="thumb" src="'+photoData+'" alt="">' : '<div class="ph-ph">'+ICONS.camera+'</div>')+
        '<div class="pp-actions"><label for="photoInput">'+(photoData ? "Promijeni fotografiju" : "Dodaj fotografiju")+'</label>'+
        (photoData ? '<label id="recropLabel">Namjesti isječak</label>' : '')+
        '<input type="file" id="photoInput" accept="image/*"></div>';
    }
    var layer = document.createElement("div");
    layer.className = "sheet-wrap"; layer.id = "sheetLayer";
    layer.innerHTML =
      '<div class="sheet-scrim" id="scrim"></div>'+
      '<div class="sheet" role="dialog"><div class="grab"></div>'+
        '<div class="sh-top"><button class="navbtn" id="cancelSheet">Odustani</button><h3>'+(isEdit ? "Uredi vozilo" : "Novo vozilo")+'</h3><button class="navbtn strong" id="saveSheet">Spremi</button></div>'+
        '<div class="sheet-body">'+
          '<div class="photo-pick" id="photoPickRow">'+photoRow()+'</div>'+
          group("Vrsta", '<div class="field tappable" id="fTypeField">'+typeFieldInner()+'</div>'+
            '<div class="field" id="fUnitRow"'+(vType(vtype).hours ? '' : ' hidden')+'><div class="fl">Servisni interval po</div>'+segHtml([["km","Kilometrima"],["h","Radnim satima"]], unit, unit, "data-unit")+'</div>', true)+
          group("Vozilo", field("fMake","Marka","")+field("fModel","Model","")+field("fYear","Godište","","number")+field("fEngine","Motor",""))+
          group("Registracija", field("fPlate","Tablica","")+dateField("fReg","Registracija vrijedi do", regDate, "Nije uneseno")+field("fVin","VIN (opcionalno)","17 znakova"))+
          group("Održavanje", field("fKm","Trenutna kilometraža","","number")+field("fOilInt","Servisni interval (km)", String(isEdit ? (car.oilInterval||9000) : state.settings.defaultOilInterval), "number"))+
          (isEdit ? '<div class="btn-stack" id="delZone"><button class="btn danger" id="delCarBtn">'+ICONS.trash+'Obriši vozilo</button></div>' : '')+
        '</div>'+
      '</div>';
    document.getElementById("screenInner").appendChild(layer);
    if(isEdit){
      setVal("fMake", car.make); setVal("fModel", car.model); setVal("fYear", car.year); setVal("fEngine", car.engine);
      setVal("fPlate", car.plate); setVal("fVin", car.vin); setVal("fKm", car.km); setVal("fOilInt", car.oilInterval||9000);
    }
    document.getElementById("scrim").addEventListener("click", closeSheet);
    document.getElementById("cancelSheet").addEventListener("click", closeSheet);
    settleSegs(layer);
    function applyUnit(){
      var h = unit === "h";
      document.querySelector('label[for="fKm"]').textContent = h ? "Radni sati motora" : "Trenutna kilometraža";
            document.querySelector('label[for="fOilInt"]').textContent = h ? "Servisni interval (h)" : "Servisni interval (km)";
      var oi = document.getElementById("fOilInt");
            if(!isEdit || car.unit !== unit) oi.value = h ? "100" : String(state.settings.defaultOilInterval);
      var boat = vtype === "brod" || vtype === "jetski";
      document.querySelector('label[for="fPlate"]').textContent = boat ? "Registarska oznaka" : "Tablica";
          }
    function setUnitSeg(){
      var seg = layer.querySelector("#fUnitRow .seg");
      Array.prototype.forEach.call(seg.querySelectorAll("button"), function(x){ x.classList.toggle("on", x.getAttribute("data-unit")===unit); });
      seg.querySelector(".seg-thumb").style.transform = "translateX("+(unit==="h"?100:0)+"%)";
    }
    Array.prototype.forEach.call(layer.querySelectorAll("[data-unit]"), function(b){
      b.addEventListener("click", function(){ unit = b.getAttribute("data-unit"); setUnitSeg(); applyUnit(); });
    });
    document.getElementById("fTypeField").addEventListener("click", function(){
      openVehicleTypePicker(vtype, function(id){
        vtype = id;
        var t = vType(id);
        document.getElementById("fTypeField").innerHTML = typeFieldInner();
        document.getElementById("fUnitRow").hidden = !t.hours;
        unit = t.hoursOnly ? "h" : t.hours ? t.unit : "km";
        if(t.hours) setUnitSeg();
        applyUnit();
      });
    });
    if(isEdit) applyUnit();
    document.getElementById("fRegField").addEventListener("click", function(){
      openDatePicker(regDate || addDays(todayISO(), 365), function(iso){
        regDate = iso;
        var d = document.getElementById("fRegDisplay"); d.textContent = fmtLong(iso); d.classList.remove("ph");
      });
    });
    function wirePhoto(){
      document.getElementById("photoInput").addEventListener("change", function(e){
        var f = e.target.files && e.target.files[0]; if(!f) return;
        var reader = new FileReader();
        reader.onload = function(ev){ openCropper(ev.target.result, function(c){ photoData = c; refresh(); }); };
        reader.readAsDataURL(f);
      });
      var rc = document.getElementById("recropLabel");
      if(rc) rc.addEventListener("click", function(){ if(photoData) openCropper(photoData, function(c){ photoData = c; refresh(); }); });
    }
    function refresh(){ document.getElementById("photoPickRow").innerHTML = photoRow(); wirePhoto(); }
    wirePhoto();

    if(isEdit){
      document.getElementById("delCarBtn").addEventListener("click", function(){
        document.getElementById("delZone").innerHTML =

  function openDatePicker(initialISO, onPick){
    var existing = document.getElementById("datePickerLayer");
    if(existing) existing.remove();
    var d = initialISO ? new Date(initialISO+"T12:00:00") : new Date();
    var cur = {y:d.getFullYear(), m:d.getMonth()};
    var layer = document.createElement("div");
    layer.className = "sheet-wrap"; layer.id = "datePickerLayer";
    layer.innerHTML =
      '<div class="sheet-scrim" id="dpScrim"></div>'+
      '<div class="sheet" role="dialog" aria-label="Odaberi datum"><div class="grab"></div>'+
        '<div class="sh-top"><button class="navbtn" id="dpCancel">Odustani</button><h3>Odaberi datum</h3><span></span></div>'+
        '<div class="sheet-body" id="dpBody"></div>'+
      '</div>';
    document.getElementById("screenInner").appendChild(layer);
    function close(cb){ closeLayer(layer, cb); }
    document.getElementById("dpScrim").addEventListener("click", function(){ close(); });
    document.getElementById("dpCancel").addEventListener("click", function(){ close(); });
    function renderCal(){
      var first = new Date(cur.y, cur.m, 1);
      var startWeekday = (first.getDay()+6)%7;
      var daysInMonth = new Date(cur.y, cur.m+1, 0).getDate();
      var cells = "";
      for(var i=0;i<startWeekday;i++) cells += '<div class="dp-cell dp-empty"></div>';
      for(var n=1; n<=daysInMonth; n++){
        var iso = cur.y+"-"+pad2(cur.m+1)+"-"+pad2(n);
        cells += '<button type="button" class="dp-cell'+(iso===todayISO()?" today":"")+(iso===initialISO?" sel":"")+'" data-dp-day="'+iso+'">'+n+'</button>';
      }
      var body = document.getElementById("dpBody");
      body.innerHTML =
        '<div class="dp-head"><button type="button" class="round-btn" id="dpPrev" aria-label="Prethodni mjesec">'+ICONS.back+'</button><span>'+MONTH_NAMES[cur.m]+' '+cur.y+'.</span><button type="button" class="round-btn" id="dpNext" aria-label="Sljedeći mjesec">'+ICONS.chev+'</button></div>'+
        '<div class="dp-grid">'+WEEKDAY_NAMES.map(function(w){ return '<div class="dp-wd">'+w+'</div>'; }).join("")+cells+'</div>';
      document.getElementById("dpPrev").addEventListener("click", function(){ cur.m--; if(cur.m<0){ cur.m = 11; cur.y--; } renderCal(); });
      document.getElementById("dpNext").addEventListener("click", function(){ cur.m++; if(cur.m>11){ cur.m = 0; cur.y++; } renderCal(); });
      Array.prototype.forEach.call(body.querySelectorAll("[data-dp-day]"), function(el){
        el.addEventListener("click", function(){ var iso = el.getAttribute("data-dp-day"); close(function(){ onPick(iso); }); });
      });
    }
    renderCal();
  }

  function chipsHtml(list, attr, selected){

  function wireSingleChips(layer, attr, onChange){
    Array.prototype.forEach.call(layer.querySelectorAll("["+attr+"]"), function(btn){
      btn.addEventListener("click", function(){
        var on = btn.classList.contains("on");
        Array.prototype.forEach.call(layer.querySelectorAll("["+attr+"]"), function(b){ b.classList.remove("on"); });
        if(!on) btn.classList.add("on");
        onChange(on ? "" : btn.getAttribute(attr));
      });
    });
  }

      close(function(){ toast("Podsjetnik dodan"); render("none"); });

    wireTypes(); applyMeter();
    Array.prototype.forEach.call(s.layer.querySelectorAll("[data-remmode]"), function(b){
      b.addEventListener("click", function(){
        mode = b.getAttribute("data-remmode");

      s.close(function(){
        if(serviceTypesFor(car).indexOf(it.title) !== -1 && it.title !== "Ostalo") openServiceSheet(car.id, {types:[it.title], onSaved:dropRem});
        else {
          var known = EXPENSE_TYPES.indexOf(it.title) !== -1;
          openExpenseSheet(car.id, {cat:known ? it.title : "Ostalo", note:it.note || (known ? "" : it.title), allowEmpty:true, title:"Obavljeno", onSaved:dropRem});

      s.close(function(){ toast("Podsjetnik obrisan"); render("none"); });

      openDatePicker(car.regDate, function(iso){

      });
    });
    if(byId("rdSvc")) byId("rdSvc").addEventListener("click", function(){ s.close(function(){ openServiceSheet(car.id); }); });
  }

    layer.innerHTML =
      '<div class="crop-top"><button id="cropCancel">Odustani</button><h3>Namjesti fotografiju</h3><button class="primary" id="cropSave">Gotovo</button></div>'+
      '<div class="crop-stage" id="cropStage"><div class="crop-frame" id="cropFrame"><img id="cropImg" alt="" src="'+srcDataUrl+'">'+
        '<div class="crop-grid"><i class="v" style="left:33.333%"></i><i class="v" style="left:66.666%"></i><i class="h" style="top:33.333%"></i><i class="h" style="top:66.666%"></i></div>'+
      '</div></div>'+
      '<div class="crop-bottom"><div class="crop-hint">Povuci za pomak · raširi ili stisni prste za zum<br>Dvaput dodirni za brzi zum</div><button class="crop-reset" id="cropReset">Vrati na početno</button></div>';
    document.getElementById("screenInner").appendChild(layer);
    var stage = document.getElementById("cropStage"), frame = document.getElementById("cropFrame"), imgEl = document.getElementById("cropImg");
    var frameW = Math.min(stage.clientWidth - 24, 320), frameH = Math.round(frameW*9/16);
    frame.style.width = frameW+"px"; frame.style.height = frameH+"px";
    var MAX_ZOOM = 5, natW = 0, natH = 0, base = 1, zoom = 1, offX = 0, offY = 0;
    function sc(){ return base*zoom; }
    function clamp(){
      var w = natW*sc(), h = natH*sc();
      offX = Math.min(0, Math.max(frameW-w, offX));
      offY = Math.min(0, Math.max(frameH-h, offY));
    }
    function apply(){
      imgEl.style.width = (natW*sc())+"px"; imgEl.style.height = (natH*sc())+"px";
      imgEl.style.transform = "translate("+offX+"px,"+offY+"px)";
    }
    function zoomAt(z, fx, fy){
      z = Math.min(MAX_ZOOM, Math.max(1, z));
      var s0 = sc(), px = (fx-offX)/s0, py = (fy-offY)/s0;
      zoom = z;
      offX = fx-px*sc(); offY = fy-py*sc();
      clamp(); apply();
    }
    function smoothly(fn){
      if(!REDUCE_MOTION){
        imgEl.style.transition = "width 280ms var(--ease-out), height 280ms var(--ease-out), transform 280ms var(--ease-out)";
        setTimeout(function(){ imgEl.style.transition = ""; }, 300);
      }
      fn();
    }
    function reset(){ zoom = 1; offX = (frameW-natW*sc())/2; offY = (frameH-natH*sc())/2; apply(); }
    imgEl.onload = function(){
      natW = imgEl.naturalWidth; natH = imgEl.naturalHeight;
      base = Math.max(frameW/natW, frameH/natH);
      reset();
    };
    if(imgEl.complete && imgEl.naturalWidth) imgEl.onload();

    function local(e){ var r = frame.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
    function dist(a, b){ return Math.hypot(a.x-b.x, a.y-b.y) || 1; }
    function mid(a, b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
    var ptrs = {}, pinch = null, last = null;
    function pts(){ return Object.keys(ptrs).map(function(k){ return ptrs[k]; }); }
    stage.addEventListener("pointerdown", function(e){
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}
      ptrs[e.pointerId] = local(e);
      stage.classList.add("dragging");
      var p = pts();
      if(p.length >= 2){
        var m = mid(p[0], p[1]);
        pinch = {d:dist(p[0], p[1]), z:zoom, px:(m.x-offX)/sc(), py:(m.y-offY)/sc()};
        last = null;
      } else last = p[0];
    });
    stage.addEventListener("pointermove", function(e){
      if(!(e.pointerId in ptrs)) return;
      ptrs[e.pointerId] = local(e);
      var p = pts();
      if(p.length >= 2 && pinch){
        var m = mid(p[0], p[1]);
        zoom = Math.min(MAX_ZOOM, Math.max(1, pinch.z*dist(p[0], p[1])/pinch.d));
        offX = m.x-pinch.px*sc(); offY = m.y-pinch.py*sc();
        clamp(); apply();
      } else if(p.length === 1 && last){
        offX += p[0].x-last.x; offY += p[0].y-last.y; last = p[0];
        clamp(); apply();
      }
    });
    function up(e){
      delete ptrs[e.pointerId];
      var p = pts();
      pinch = null; last = p.length === 1 ? p[0] : null;
      if(!p.length) stage.classList.remove("dragging");
    }
    stage.addEventListener("pointerup", up);
    stage.addEventListener("pointercancel", up);
    stage.addEventListener("wheel", function(e){
      e.preventDefault();
      var q = local(e);
      zoomAt(zoom*Math.exp(-e.deltaY*0.0015), q.x, q.y);
    }, {passive:false});
    stage.addEventListener("dblclick", function(e){
      var q = local(e);
      smoothly(function(){ zoomAt(zoom > 1.4 ? 1 : 2.2, q.x, q.y); });
    });
    document.getElementById("cropReset").addEventListener("click", function(){ smoothly(reset); });
    function close(){ layer.remove(); }
    document.getElementById("cropCancel").addEventListener("click", close);
    document.getElementById("cropSave").addEventListener("click", function(){
      var outW = 1200, outH = Math.round(outW*9/16);
      var canvas = document.createElement("canvas"); canvas.width = outW; canvas.height = outH;
      var ratio = outW/frameW;
      canvas.getContext("2d").drawImage(imgEl, offX*ratio, offY*ratio, natW*sc()*ratio, natH*sc()*ratio);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.86);
      close(); onSave(dataUrl);
    });
  }

  // ---------- tab bar ----------
  Array.prototype.forEach.call(tabbar.querySelectorAll(".tab"), function(btn){
    btn.addEventListener("click", function(){
      var t = btn.dataset.tab;
      if(t === state.activeTab){
        if(t === "vozila" && state.screen === "detail"){ state.screen = "home"; render("back"); }
        return;
      }
      state.activeTab = t;
      state.wipeConfirm = false;
      if(t === "stat"){ state.statsMonth = null; state.statsYear = null; }
      if(!REDUCE_MOTION){ btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop"); }
      render("fade");
    });
  });

  // ---------- clock ----------
  (function(){
    function tick(){ var d = new Date(); document.getElementById("clock").textContent = d.getHours()+":"+pad2(d.getMinutes()); }
    tick(); setInterval(tick, 15000);
  })();

  render("fade");
})();
</script>

<script>
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js"); }); }
</script>
